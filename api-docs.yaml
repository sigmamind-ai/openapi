openapi: 3.0.1
info:
  title: SigmaMind APIs
  description: OpenAPI documentation SigmaMind Agent Builder APIs
  version: "1.0"
servers:
- url: https://api.sigmamind.ai
  description: SigmaMind AI Agent Builder APIs
security:
- apiKeyAuth: []
tags:
- name: Chats
  description: "Endpoints for creating and managing text-based chat sessions with\
    \ an agent. A session is started by specifying an agent and an opening message.\
    \ Returns a chatId used in all subsequent get, update, completion, and end-session\
    \ calls."
- name: Calls
  description: "Endpoints for creating and managing outbound phone calls. A call is\
    \ initiated by specifying an agent, caller number, and destination number — dynamic\
    \ variables can be included to personalise the agent's behaviour. Returns a callId\
    \ used in all subsequent get and delete operations."
- name: Phone Numbers
  description: "Endpoints for managing phone numbers used in outbound and inbound calls.
    Supports purchasing a new number through SigmaMind or importing an existing number
    via SIP trunking (BYO). Each number can be assigned separate inbound and outbound
    agents."
- name: Campaigns
  description: "Endpoints for creating and managing outbound call campaigns. A campaign\
    \ dials a CSV-uploaded contact list using a selected agent and caller number,\
    \ with support for immediate or scheduled launch. Returns a campaignId used in\
    \ all subsequent get, update, and delete operations."
- name: Agents
  description: "Endpoints for creating and managing single prompt agents. An agent\
    \ is configured with a system prompt, voice settings, and optional tools. Returns\
    \ an agentId used in all subsequent update, call, and simulation operations."
- name: Integrations
  description: "Endpoints for creating and managing third-party integrations (e.g.\
    \ Shopify, Cal.com). An integration links your account to an external service\
    \ and acts as the parent resource for auth credentials and API tools. Returns\
    \ an integrationId used in all subsequent auth and tool operations."
- name: Integration Auth
  description: "Endpoints for managing authentication credentials for a third-party\
    \ integration. Supports API Key, Basic, and Bearer token credential types — scoped\
    \ to an integration and injected automatically by tools when executing. Returns\
    \ an authId used in all subsequent get, update, and delete operations."
- name: Integration Tools
  description: "Endpoints for creating and managing API tools backed by a third-party\
    \ integration. Each tool defines an HTTP endpoint, method, and parameter schema\
    \ — scoped to an integration and using its stored auth credentials when executing.\
    \ Returns a toolId used in all subsequent get, update, delete, and execute operations."
- name: Webhooks
  description: "Endpoints for registering and managing webhooks. A webhook delivers
    real-time event notifications via HTTP POST when selected events occur on a specific
    agent — each webhook is scoped to one agent and one or more event types. Payloads
    are signed with an HMAC secret — verify the signature on your server to confirm
    authenticity."
- name: Test Cases
  description: "Endpoints for creating and managing simulation test cases for an agent.\
    \ A test case defines a conversation scenario — including user persona, goals,\
    \ and expected behaviour — used to generate a synthetic conversation with the\
    \ agent. Returns a testCaseId used in all subsequent get, update, delete, and\
    \ batch-run operations."
- name: Batch Runs
  description: "Endpoints for creating and managing batch runs of simulation test cases.
    A batch run executes multiple test cases in parallel against a selected agent
    and aggregates the results for review. Returns a batchId used in all subsequent
    get and list test-run operations."
- name: Test Runs
  description: "Endpoints for retrieving test run results within a batch. Each test\
    \ run represents a single test case execution within a batch run, identified by\
    \ a jobId. Use batchId and agentId to scope results to the correct batch."  
- name: API Keys
  description: "Endpoints for creating and managing API keys used to authenticate\
    \ public API requests. Each key must be included in the X-API-Key request header.\
    \ Returns a keyId used in all subsequent get, revoke, and delete operations."
- name: QA Rules
  description: "Endpoints for creating and managing quality assurance rules applied
    to agent conversations. A QA rule defines evaluation criteria used to automatically
    assess conversation quality. Returns a qaRuleId used in all subsequent get, update, 
    and delete operations."
- name: QA Issues
  description: "Endpoints for retrieving and managing quality assurance issues flagged
    across agent conversations. A QA issue is created with status 'Fail' when a conversation violates
    one or more QA rules — capturing the offending rule reference. It is created with status 'Success'
    when the conversation passes the evaluation criteria of QA rule(s).
    Returns a qaIssueId used in all subsequent get operations."     
paths:
  # Calls APIs
  /v1/calls:
    get:
      tags:
      - Calls
      summary: List Phone Calls
      description: "Returns a paginated list of call records for the account, sorted\
        \ by most recently created first. Use the status parameter to filter by call\
        \ state. Use page and size to navigate through results."
      operationId: listPhoneCall
      parameters:
      - name: status
        in: query
        description: "Filter calls by their current state. Accepted values: 'scheduled',\
          \ 'in_progress', 'ended', 'not_connected', 'error'. Omit to return calls\
          \ in all states."
        required: false
        schema:
          type: string
        example: ended
      - name: page
        in: query
        description: Zero-based page number to retrieve. Use 0 for the first page.
          Must be 0 or greater.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
        example: 0
      - name: size
        in: query
        description: Number of calls to return per page. Must be 1 or greater. Defaults
          to 10.
        required: false
        schema:
          type: integer
          format: int32
          default: 10
        example: 10
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponseCallResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    error: Bad Request
                    message: Invalid request parameters
                    path: /v1/calls
                    status: 400
                    timestamp: 2026-05-05T10:06:43.846335
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    error: Unauthorized
                    message: X-API-Key is missing or invalid
                    path: /v1/calls
                    status: 401
                    timestamp: 2026-05-05T10:06:43.846359
        "403":
          description: Forbidden
