        totalPages:
          type: integer
          description: Total number of pages available based on totalCounts and size.
            Helps clients understand how many pages exist in total.
          format: int32
          example: 7
        hasNext:
          type: boolean
          description: Indicates whether there is a next page available after the
            current one. Useful for implementing 'Load More' or next navigation.
          example: true
        hasPrevious:
          type: boolean
          description: Indicates whether there is a previous page before the current
            one. Useful for enabling backward navigation.
          example: false
      description: Standard wrapper for paginated API responses. Use this when returning
        list data that is split across multiple pages. Includes the current page of
        results along with pagination metadata to help clients navigate through large
        datasets efficiently.

    # Test Run APIs Schemas
    TestCaseRunResponse:
      type: object
      properties:
        batchId:
          type: string
          description: The unique identifier of the batch run this simulation attempt
            belongs to.
          example: batch_s0OJu2JWR8R45Fai
        workspaceId:
          type: string
          description: The unique identifier of the workspace under which this simulation
            attempt was created.
          example: org_V6eZ2zg8ziDx5pft
        agent:
          $ref: '#/components/schemas/AgentResponse'
        testCase:
          $ref: '#/components/schemas/TestCaseResponse'
        jobId:
          type: string
          description: The unique identifier of this individual simulation attempt
            within the batch run.
          example: job_ksUu5yRHGTLLrLeM
        chatId:
          type: string
          description: The unique identifier of the chat session generated during
            this simulation run.
          example: chat_IpELinkFvINQ1212
        createdDate:
          type: string
          description: The UTC timestamp indicating when this simulation run was initiated.
          format: date-time
          example: 2026-03-26T10:52:45.565905Z
        completedDate:
          type: string
          description: The UTC timestamp indicating when this simulation run was completed.
          format: date-time
          example: 2026-03-26T10:54:45.565905Z
        isSuccessful:
          type: boolean
          description: Indicates whether the Agent met the success criteria during
            this simulation run.
          example: true
        remarks:
          type: string
          description: "A plain-language explanation of why the simulation run was\
            \ evaluated as successful or failed, based on the success criteria."
          example: The Agent successfully maintained focus on the primary task of
            addressing the customer's order enquiry.
        conversation:
          type: array
          description: The full transcript of the conversation between the simulated
            user and the Agent during this simulation run.
          items:
            $ref: '#/components/schemas/ConversationResponse'
      description: List of items for the current page. Contains up to 'size' number
        of records.
    ConversationResponse:
      type: object
      properties:
        role:
          type: string
          description: The role of the participant who sent this message in the simulation.
            Indicates whether the message was generated by the simulated user or the
            Agent.
          example: user
        content:
          type: string
          description: The message content produced by the participant for this turn
            in the conversation.
          example: I want to cancel my subscription immediately.
      description: The full transcript of the conversation between the simulated user
        and the Agent during this simulation run.
    PaginatedResponseTestCaseRunResponse:
      type: object
      properties:
        data:
          type: array
          description: List of items for the current page. Contains up to 'size' number
            of records.
          items:
            $ref: '#/components/schemas/TestCaseRunResponse'
        page:
          type: integer
          description: Current page number (0-based index). Indicates which page of
            results is being returned.
          format: int32
          example: 0
        size:
          type: integer
          description: Number of items requested per page. Determines the maximum
            size of the 'data' list.
          format: int32
          example: 20
        totalCount:
          type: integer
          description: Total number of records available across all pages. Useful
            for calculating pagination on the client side.
          format: int64
          example: 125
        totalPages:
          type: integer
          description: Total number of pages available based on totalCounts and size.
            Helps clients understand how many pages exist in total.
          format: int32
          example: 7
        hasNext:
          type: boolean
          description: Indicates whether there is a next page available after the
            current one. Useful for implementing 'Load More' or next navigation.
          example: true
        hasPrevious:
          type: boolean
          description: Indicates whether there is a previous page before the current
            one. Useful for enabling backward navigation.
          example: false
      description: Standard wrapper for paginated API responses. Use this when returning
        list data that is split across multiple pages. Includes the current page of
        results along with pagination metadata to help clients navigate through large
        datasets efficiently.
    
    # QA Rule APIs Schemas
    CreateQARuleRequest:
      required:
      - agentIds
      - evaluationCriteria
      - ruleName
      type: object
      properties:
        ruleName:
          type: string
          description: "The name of the QA rule, used to identify it in rule lists\
            \ and evaluation reports."
          example: Tone & Professionalism Check
        ruleDescription:
          type: string
          description: A brief explanation of what this QA rule evaluates and its
            intended purpose.
          example: Ensures agents maintain a professional and empathetic tone throughout
            the conversation.
        evaluationCriteria:
          type: string
          description: The specific criteria used to evaluate agent responses against
            this rule.
          example: "Evaluate whether agent greeted the customer by name, avoided interrupting,\
            \ and closed with a resolution summary."
        expectedValue:
          type: boolean
          description: "The expected outcome of the evaluation criteria that determines\
            \ a successful QA result. Set to true if the evaluation criteria returning\
            \ true should be treated as a Success, or false if the evaluation criteria\
            \ returning true should be treated as a Fail. Default is true."
          example: true
          enum:
          - true
          - false
        agentIds:
          type: array
          description: List of agent Ids on which QA rule would apply
          example:
          - D5D0p7TUs66TTAEAx
          items:
            type: string
            # description: List of agent Ids on which QA rule would apply
            example: "[\"D5D0p7TUs66TTAEAx\"]"
    UpdateQARuleRequest:
      type: object
      properties:
        ruleName:
          type: string
          description: "The name of the QA rule, used to identify it in rule lists\
            \ and evaluation reports."
          example: Tone & Professionalism Check
        ruleDescription:
          type: string
          description: A brief explanation of what this QA rule evaluates and its
            intended purpose.
          example: Ensures agents maintain a professional and empathetic tone throughout
            the conversation.
        evaluationCriteria:
          type: string
          description: The specific criteria used to evaluate agent responses against
            this rule.
          example: "Evaluate whether agent greeted the customer by name, avoided interrupting,\
            \ and closed with a resolution summary."
        expectedValue:
          type: boolean
          description: "The expected outcome of the evaluation criteria that determines\
            \ a successful QA result. Set to true if the evaluation criteria returning\
            \ true should be treated as a Success, or false if the evaluation criteria\
            \ returning true should be treated as a Fail."
          example: true
          enum:
          - true
          - false
        agentIds:
          type: array
          description: List of agent Ids on which QA rule would apply
          example:
          - D5D0p7TUs66TTAEAx
          items:
            type: string
            # description: List of agent Ids on which QA rule would apply
            example: "[\"D5D0p7TUs66TTAEAx\"]"
    QARuleResponse:
      type: object
      properties:
        qaRuleId:
          type: string
          description: The unique identifier of the QA rule.
          example: rule_YYdKgw1masomMfe8
        workspaceId:
          type: string
          description: The unique identifier of the workspace this QA rule belongs
            to.
          example: org_V6eZ2zg8ziDx5pft
        ruleName:
          type: string
          description: "The name of the QA rule, used to identify it in rule lists\
            \ and evaluation reports."
          example: Tone & Professionalism Check
        ruleDescription:
          type: string
          description: A brief explanation of what this QA rule evaluates and its
            intended purpose.
          example: Ensures agents maintain a professional and empathetic tone throughout
            the conversation.
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentResponse'
        evaluationCriteria:
          type: string
          description: The specific criteria or rubric used to evaluate agent responses
            against this rule.
          example: "Evaluate whether agent greeted the customer by name, avoided interrupting,\
            \ and closed with a resolution summary."
        expectedValue:
          type: boolean
          description: "The expected evaluation result that determines whether the\
            \ QA rule is satisfied. When the evaluation criteria returns a result\
            \ matching this expected value, the interaction is marked as a Success;\
            \ otherwise it is marked as a Fail."
          example: true
    PaginatedResponseQARuleResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/QARuleResponse'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean

    # QA Issue APIs Schemas
    QAIssueResponse:
      type: object
      properties:
        qaIssueId:
          type: string
          description: The unique identifier of the QA issue.
          example: issue_1fueLBh6mJxwLbe1
        qaRuleId:
          type: string
          description: The unique identifier of the QA rule that triggered this issue.
          example: rule_YYdKgw1masomMfe8
        workspaceId:
          type: string
          description: The unique identifier of the workspace in which this QA issue
            was raised.
          example: org_GdDTrzEppfUfSZPE
        agentId:
          type: string
          description: The unique identifier of the agent whose interaction triggered
            this QA issue.
          example: D5D0p7TUs66TTAEAx
        callId:
          type: string
          description: The unique identifier of the call or chat associated with this
            QA issue.
          example: call-H0eS7imseNUp0jCM
        channel:
          type: string
          description: The communication channel through which the interaction occurred
            that raised this QA issue.
          example: voice
          enum:
          - chat
          - voice
        result:
          type: string
          description: The outcome of the QA evaluation for this issue. Reflects whether
            the agent's interaction met or failed the associated QA rule's evaluation
            criteria.
          example: Fail
          enum:
          - Success
          - Fail
        remarks:
          type: string
          description: Additional remarks or context provided by the evaluator regarding
            this QA issue.
          example: Agent failed to acknowledge the customer's frustration before proceeding
            with troubleshooting.
        qaRuleSnapshot:
          $ref: '#/components/schemas/QARuleResponse'
    PaginatedResponseQAIssueResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/QAIssueResponse'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean

    # Other Schemas
    AgentResponse:
      type: object
      properties:
        name:
          type: string
          description: The display name of the assigned agent.
          example: New AI Agent
        agentId:
          type: string
          description: The unique identifier of the agent within the system.
          example: agent_D5D0p7TUs66TTAEAx
        status:
          type: string
          description: The current operational status of the agent.
          example: Live
          enum:
          - Live
          - Testing
          - Disabled
      description: "Agent assigned to handle all calls in this campaign. Contains\
        \ the agent's ID, name, and current status. All contacts in the campaign's\
        \ contact list will be called using this agent."
    JsonNode:
      type: object
      description: "Dynamic key-value pairs that were passed to the agent at call\
        \ start for personalisation. Keys correspond to variable names defined in\
        \ the agent's configuration (e.g., 'customer_name', 'account_id'). Null or\
        \ empty if no dynamic variables were provided when the call was created."
      example:
        customer_name: Michael
        account_id: ACC-001

    # Error Schema
    Error:
      type: object
      properties:
        timestamp:
          type: string
          description: Error timestamp in ISO format
          format: date-time
        status:
          type: integer
          description: HTTP status code
          example: 400
        error:
          type: string
          description: Error type or HTTP status message
          example: Bad Request
        message:
          type: string
          description: Detailed error message
          example: Email is required
        path:
          type: string
          description: Request path where error occurred
          example: /v1/users
        validationErrors:
          type: object
          description: Field validation errors (if any)
          example: |-
            {
              "email": "Email is required",
              "name": "Name is too short"
            }
      description: Standard error response

  securitySchemes:
    apiKeyAuth:
      type: apiKey
      description: Authenticate every request by passing your API key in the `X-API-Key` header. To get your key, go to Dashboard → API Keys and create or copy your Production API key.
      name: X-API-Key
      in: header
