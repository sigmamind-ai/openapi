    WebhookConfigUpdateRequest:
      required:
      - name
      - url
      type: object
      properties:
        webhookId:
          type: string
          description: A unique identifier for the webhook.
          example: wh_BUbkx3PsbzQm5V10
        name:
          type: string
          description: The display name of the webhook for easy identification.
          example: My Webhook
        url:
          pattern: https?://.+
          type: string
          description: The HTTPS endpoint to which the webhook payload will be sent.
            Must be a valid HTTPS URL.
          example: https://example.com/webhook
        events:
          uniqueItems: true
          type: array
          description: List of events that will trigger the webhook. Each event name
            corresponds to a specific type of activity in the system.
          items:
            type: string
            description: List of events that will trigger the webhook. Each event
              name corresponds to a specific type of activity in the system.
            enum:
            - conversation_started
            - conversation_ended
            - conversation_analysed
        active:
          type: boolean
          description: Flag to enable or disable the webhook.
          example: false
          default: true
    TransferSettings:
      required:
      - transferType
      type: object
      properties:
        transferType:
          pattern: warm|cold
          type: string
          description: "Type of transfer to perform. 'warm' keeps the current agent\
            \ connected during the transfer, while 'cold' disconnects the agent immediately\
            \ after initiating the transfer."
          enum:
          - warm
          - cold
        ringingDuration:
          maximum: 60
          minimum: 25
          type: integer
          description: Specifies the maximum duration (in seconds) to wait for the
            call to be answered.
          format: int32
          example: 40
          default: 30
        waitForParticipantAnswer:
          type: boolean
          description: "If true, agent will wait for the new participant to answer\
            \ the call."
          default: true
        enableWhisperMessage:
          type: boolean
          description: "If true, a whisper message will be played privately to the\
            \ destination participant before the caller is connected."
        whisperMessage:
          type: string
          description: "The content of the whisper message. Its interpretation depends\
            \ on whisperMessageType. If the type is 'static', this text is played\
            \ directly. If the type is 'prompt', the text is treated as a prompt that\
            \ the system uses to dynamically generate the whisper message."
        whisperMessageType:
          pattern: static|prompt
          type: string
          description: "Defines how the whisperMessage should be interpreted. 'static'\
            \ means the message is used as-is, while 'prompt' means the message is\
            \ treated as a prompt for generating the final whisper message."
          default: static
          enum:
          - static
          - prompt
        enableThreeWayMessage:
          type: boolean
          description: "If true, a message will be delivered once the call becomes\
            \ a three-way conversation between the caller, the current agent, and\
            \ the destination participant."
        threeWayMessage:
          type: string
          description: "The content of the message delivered during the three-way\
            \ connection. Its interpretation depends on threeWayMessageType. If 'static',\
            \ the message is used directly. If 'prompt', it is treated as a prompt\
            \ for generating the final message."
        threeWayMessageType:
          pattern: static|prompt
          type: string
          description: "Defines how the threeWayMessage should be interpreted. 'static'\
            \ means the message is used as-is, while 'prompt' means the message is\
            \ treated as a prompt for generating the final message."
          default: static
          enum:
          - static
          - prompt
        customHeaders:
          type: object
          description: Send custom header key and values along with call transfer.
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: object
              - type: array
      description: Configuration for the call transfer behaviour
    Variable:
      required:
      - description
      - variableName
