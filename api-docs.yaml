  # Campaign APIs
  /v1/campaigns:
    get:
      tags:
      - Campaigns
      summary: List Campaigns
      description: "Returns a paginated list of campaigns for the account, sorted\
        \ by most recently created first. Use the status parameter to filter by lifecycle\
        \ state. Use page and size to navigate through results."
      operationId: listCampaigns
      parameters:
      - name: status
        in: query
        description: "Filter campaigns by their current lifecycle state. Accepted\
          \ values: 'live', 'scheduled', 'paused', 'completed'. Omit to return campaigns\
          \ in all states."
        required: false
        schema:
          type: string
        example: live
      - name: page
        in: query
        description: Zero-based page number to retrieve. Use 0 for the first page.
          Must be 0 or greater.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
        example: 0
      - name: size
        in: query
        description: Number of campaigns to return per page. Must be 1 or greater.
          Defaults to 10.
        required: false
