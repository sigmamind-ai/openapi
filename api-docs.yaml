          example: Support Line - US
    UpdatePhoneNumberRequest:
      type: object
      properties:
        friendlyName:
          maxLength: 128
          minLength: 0
          type: string
          description: Updated human-readable label for this phone number. Used to
            identify it in listings and dashboards. Omit to leave the existing label
            unchanged.
          example: Support Line - US
        inboundAgentId:
          maxLength: 64
          minLength: 0
          type: string
          description: Updated agent ID for handling inbound calls received on this
            number. Replaces the currently assigned inbound agent. All inbound calls
            arriving after this update will be routed to the new agent. Pass null
            to remove the inbound agent assignment. Omit to leave the existing assignment
            unchanged.
          example: awTw7UKhOsLGiDbt
        outboundAgentId:
          maxLength: 64
          minLength: 0
          type: string
          description: Updated agent ID for handling outbound calls made from this
            number. Replaces the currently assigned outbound agent. All outbound calls
            placed after this update will use the new agent. Pass null to remove the
            outbound agent assignment. Omit to leave the existing assignment unchanged.
          example: awTw7UKhOsLGiDbt
        terminationSipUri:
          maxLength: 253
          minLength: 0
          type: string
          description: Updated SIP URI of the termination endpoint used to route outbound
            calls through the SIP trunk. Applicable only for BYO numbers imported
            via SIP trunking — has no effect on SigmaMind-provisioned numbers. Obtain
            this value from your telecom provider's SIP trunking configuration. Omit
            to leave the existing SIP URI unchanged.
          example: sip.telnyx.com
        trunkUsername:
          maxLength: 128
          minLength: 0
          type: string
          description: Updated username for authenticating outbound calls on the SIP
            trunk. Applicable only for BYO numbers — must match the trunk username
            in your provider's account. Omit to leave the existing username unchanged.
          example: my_trunk_user
        trunkPassword:
          maxLength: 128
          minLength: 0
          type: string
          description: Updated password for authenticating outbound calls on the SIP
            trunk. Applicable only for BYO numbers — must match the trunk password
            in your provider's account. Stored securely and never returned in API
            responses. Omit to leave the existing password unchanged.
          example: tr!nkP@ssword
        outboundPhoneNumber:
          pattern: "^\\+[1-9][0-9]{6,14}$"
          type: string
          description: "Updated default destination number for test calls placed from\
            \ this number, in +E.164 format. Used to verify the number and trunk configuration\
            \ are working correctly. Must be a valid number capable of receiving calls.\
            \ Omit to leave the existing test number unchanged."
          example: "+14155552671"
      description: Request body to partially update a phone number record. Only fields
        included in the request are updated — omitted fields remain unchanged. Applies
        to both SigmaMind-provisioned numbers and BYO numbers imported via SIP trunking.
    PaginatedResponsePhoneNumberResponse:
      type: object
      properties:
        data:
          type: array
          description: List of items for the current page. Contains up to 'size' number
            of records.
          items:
            $ref: '#/components/schemas/PhoneNumberResponse'
        page:
          type: integer
          description: Current page number (0-based index). Indicates which page of
            results is being returned.
          format: int32
          example: 0
        size:
          type: integer
          description: Number of items requested per page. Determines the maximum
            size of the 'data' list.
          format: int32
          example: 20
        totalCount:
          type: integer
          description: Total number of records available across all pages. Useful
            for calculating pagination on the client side.
          format: int64
          example: 125
        totalPages:
          type: integer
          description: Total number of pages available based on totalCounts and size.
            Helps clients understand how many pages exist in total.
          format: int32
          example: 7
        hasNext:
          type: boolean
          description: Indicates whether there is a next page available after the
            current one. Useful for implementing 'Load More' or next navigation.
          example: true
        hasPrevious:
          type: boolean
          description: Indicates whether there is a previous page before the current
            one. Useful for enabling backward navigation.
          example: false
      description: Standard wrapper for paginated API responses. Use this when returning
        list data that is split across multiple pages. Includes the current page of
        results along with pagination metadata to help clients navigate through large
        datasets efficiently.

    # Agent APIs Schemas
    CreateAgentRequest:
      required:
      - instructions
      type: object
      properties:
        agentName:
          maxLength: 128
          minLength: 0
          type: string
          description: The name of the agent.
          example: Auralis
        instructions:
          type: string
          description: "Instructional prompt provided to the agent to guide its behavior,\
            \ tone, and task execution."
          example: You are a helpful customer support assistant. Answer concisely
            and professionally.
        welcomeMessageType:
          type: string
          description: Specifies whether the welcome message is static or dynamically
            generated from a prompt.
          example: static
          enum:
          - static
          - prompt
        welcomeMessage:
          type: string
          description: "The content of the welcome message. If 'welcomeMessageType'\
            \ is 'static', this contains the exact message shown to the user. If it\
            \ is 'prompt', this contains the prompt used to generate the welcome message\
            \ dynamically."
          example: Welcome to our service! How can I assist you today?
        agentSettings:
          $ref: '#/components/schemas/CreateAgentSettingsRequest'
        tools:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/VoiceTransferCallTool'
            - $ref: '#/components/schemas/ExtractVariablesTool'
            - $ref: '#/components/schemas/IvrNavigatorTool'
            - $ref: '#/components/schemas/VoiceEndCallTool'
            - $ref: '#/components/schemas/IntegrationTool'
  
    CreateAgentSettingsRequest:
      type: object
      properties:
        language:
          type: string
          description: The language your customers will primarily speak during calls.
          example: en_US
          default: en_US
          enum:
          - multi_nova3
          - multi_nova2 
          - en
          - en_US
          - en_AU
          - en_GB
          - en_NZ
          - en_IN
          - hi
          - de
          - de_CH
          - nl
          - sv
          - sv_SE
          - da
          - da_DK
          - es
          - es_419
          - fr
          - fr_CA
          - pt
          - pt_BR
          - pt_PT
          - it
          - tr
          - no
          - id
          - bg
          - ca
          - zh
          - zh_CN
          - zh_Hans
          - zh_TW
          - zh_Hant
          - zh_HK
          - cs
          - et
          - fi
          - nl_BE
          - el
          - hu
          - ja
          - ko
          - ko_KR
          - lv
          - lt
          - ms
          - pl
          - ro
          - ru
          - sk
          - th
          - th_TH
          - uk
          - vi
        aiStartsConversation:
          type: boolean
          description: "If true the AI agent will initiate the conversation immediately\
            \ when the call connects. If false the call will connect silently, waiting\
            \ for the customer to speak first before the AI responds"
          example: true
          default: true
        backgroundSound:
          type: string
          description: Add ambient background audio during the call.
          example: keyboard_typing
          default: none
          enum:
          - keyboard_typing
          - office_ambience
          - none
        interruptionSensitivity:
          maximum: 1.0
          exclusiveMaximum: false
          minimum: 0.01
          exclusiveMinimum: false
          type: number
          description: "Controls how sensitive the speech output is to user interruptions.\
            \ Lower values make the agent less likely to stop speaking when interrupted,\
            \ while higher values make it more responsive to interruptions."
          format: double
          example: 0.05
          default: 0.05
        globalPrompt:
          type: string
          description: "A global system prompt that is applied to every conversation\
            \ to define the agent’s overall behavior, tone, and constraints."
          example: You are a professional virtual assistant. Always respond politely
            and keep answers concise.
        endCallOnSilenceDuration:
          maximum: 30
          minimum: 1
          type: number
          description: Specifies the duration of continuous silence (in minutes) after
            which the call will be automatically ended.
          format: float
          example: 30
          default: 5
        maxCallDuration:
          maximum: 120
          minimum: 1
          type: integer
          description: Maximum call duration in minutes before the call is automatically
            terminated.
          format: int32
          example: 40
          default: 60
        llmModel:
          type: string
          description: The language model that powers the AI's responses.
          example: gpt-4o-mini
          default: gpt-4o-mini
        voiceId:
          type: string
          description: This is the AI's speaking voice id.
          example: elevenlabs_SGbOfpm28edC83pZ9iGb
          default: elevenlabs_EXAVITQu4vr4xnSDxMaL
        voiceModelId:
          type: string
          description: This is the AI's text to speech engine version.
          example: eleven_turbo_v2_5
          default: eleven_turbo_v2_5
        enablePostConversationInsights:
          type: boolean
          description: Indicates whether post-conversation analysis should be performed
            to extract insights after the conversation ends.
          example: true
          default: false
        postConversationInsightsLlmModel:
          type: string
          description: The language model that powers the AI's post-conversation analysis.
          example: gpt-4o-mini
          default: gpt-4o-mini
        webhooks:
          type: array
          description: List of webhook configurations that define external endpoints
            to be notified on specific events.
          items:
            $ref: '#/components/schemas/WebhookConfig'
        postConversationInsights:
          type: array
          description: List of configurations defining what insights should be extracted
            after the conversation ends.
          items:
            $ref: '#/components/schemas/PostConversationInsightsRequest'
      description: Configuration settings that control the agent's runtime behavior.
    PostConversationInsightsRequest:
      required:
      - analysisInstructions
      - dataType
      - insightName
      type: object
      properties:
        insightName:
          type: string
          description: A Unique name of the insight that will be generated from the
            conversation.
          example: conversation summary
        analysisInstructions:
          type: string
          description: Instructions or prompt that define how the insight should be
            generated from the conversation.
        dataType:
          pattern: string|boolean|number|selector
          type: string
          description: Defines the expected data type of the generated insight result.
          example: string
          enum:
          - string
          - boolean
          - number
          - selector
        options:
          type: array
          description: List of allowed selectable values. Required only when dataType
            is selector.
          example:
          - Interested
          - Not Interested
          - Follow Up Later
          items:
            type: string
            description: List of allowed selectable values. Required only when dataType
              is selector.
            example: "[\"Interested\",\"Not Interested\",\"Follow Up Later\"]"
      description: List of configurations defining what insights should be extracted
        after the conversation ends.
    WebhookConfig:
      required:
      - name
      - url
      type: object
      properties:
        name:
          type: string
          description: The display name of the webhook for easy identification.
          example: My Webhook
        url:
          pattern: https?://.+
          type: string
          description: The HTTPS endpoint to which the webhook payload will be sent.
            Must be a valid HTTPS URL.
          example: https://example.com/webhook
        events:
          uniqueItems: true
          type: array
          description: List of events that will trigger the webhook. Each event name
            corresponds to a specific type of activity in the system.
          items:
            type: string
            description: List of events that will trigger the webhook. Each event
              name corresponds to a specific type of activity in the system.
            enum:
            - conversation_started
            - conversation_ended
            - conversation_analysed
      description: List of webhook configurations that define external endpoints to
        be notified on specific events.
    CreateToolRequest:
      required:
      - type
      type: object
      properties:
        type:
          type: string
          description: Type of the tool
        description:
          type: string
          description: When to call this tool.
      discriminator:
        propertyName: type
        mapping:
          voice_transfer_call: '#/components/schemas/VoiceTransferCallTool'
          extract_variables: '#/components/schemas/ExtractVariablesTool'
          ivr_navigator: '#/components/schemas/IvrNavigatorTool'
          voice_end_call: '#/components/schemas/VoiceEndCallTool'
          integration_tool: '#/components/schemas/IntegrationTool'

      oneOf:
      - $ref: '#/components/schemas/VoiceTransferCallTool'
      - $ref: '#/components/schemas/ExtractVariablesTool'
      - $ref: '#/components/schemas/IvrNavigatorTool'
      - $ref: '#/components/schemas/VoiceEndCallTool'
      - $ref: '#/components/schemas/IntegrationTool'

