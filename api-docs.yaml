  # Webhooks APIs
  /v1/webhooks:
    get:
      tags:
      - Webhooks
      summary: List Webhooks
      description: "Returns a paginated list of webhooks for the account, sorted by\
        \ most recently created first. Use agentId to filter by agent and active to\
        \ filter by enabled/disabled status. Use page and size to navigate through\
        \ results."
      operationId: listWebhook
      parameters:
      - name: agentId
        in: query
        description: Filter webhooks by the agent they are scoped to. Obtained from
          the agentId field in the agent list or creation response. Omit to return
          webhooks across all agents.
        required: false
        schema:
          type: string
        example: D5D0p7TUs66TTAEAx
      - name: active
        in: query
        description: Filter webhooks by their active status. true returns only webhooks
          currently enabled and receiving event deliveries. false returns only disabled
          webhooks. Defaults to true.
        required: false
        schema:
          type: boolean
          default: true
        example: true
      - name: page
        in: query
        description: Zero-based page number to retrieve. Use 0 for the first page.
          Must be 0 or greater.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
        example: 0
      - name: size
        in: query
        description: Number of webhooks to return per page. Must be 1 or greater.
          Defaults to 10.
        required: false
        schema:
          type: integer
          format: int32
          default: 10
        example: 10
