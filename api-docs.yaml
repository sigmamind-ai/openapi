    # Integration Auth APIs Schemas
    CreateIntegrationAuthRequest:
      required:
      - authType
      type: object
      properties:
        authType:
          type: string
          description: "Specifies the authentication method used for outgoing requests.\
            \ Choose based on how the target API expects credentials: API_KEY → when\
            \ a key must be sent via header or query parameter. BEARER_TOKEN → when\
            \ a token is sent in the Authorization header. BASIC_AUTH → when username/password\
            \ is required. NO_AUTH → when no authentication is needed. This field\
            \ determines which other fields must be provided."
          example: API_KEY
          enum:
          - NO_AUTH
          - BASIC_AUTH
          - BEARER_TOKEN
          - API_KEY
        token:
          type: string
          description: "Access token used for Bearer authentication. Required only\
            \ when authType is BEARER_TOKEN. Automatically added to requests as: Authorization:\
            \ Bearer <token>."
          example: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
        username:
          maxLength: 256
          minLength: 0
          type: string
          description: Username used for Basic authentication. Required only when
            authType is BASIC_AUTH. Combined with password and encoded into the Authorization
            header.
          example: api_user@example.com
        password:
          type: string
          description: Password used for Basic authentication. Required only when
            authType is BASIC_AUTH. Combined with username and encoded into the Authorization
            header.
          example: s3cretP@ssword
        apiKey:
          $ref: '#/components/schemas/ApiKeyRequest'
        headers:
          type: array
          description: Optional static headers that will be included in every outgoing
            request. Useful for fixed metadata or required headers that do not change
            per request. These are applied in addition to authentication headers.
          example:
          - key: X-Request-Source
            value: sigmamind
          items:
            $ref: '#/components/schemas/HeaderEntry'
      description: Defines authentication credentials for a third-party integration.
        Use this to tell the system how to authenticate outbound API requests. Select
        an authType and provide only the fields required for that type. All other
        fields will be ignored. This configuration is applied automatically to every
        request made using this integration.
    UpdateIntegrationAuthRequest:
      type: object
      properties:
        token:
          type: string
          description: Replacement bearer token. Applicable only when the auth record
            was originally created with authType BEARER_TOKEN. Overwrites the previously
            stored token. The system will use this new value on all subsequent outbound
            requests. Omit this field to leave the existing token unchanged.
          example: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...updated
        username:
          maxLength: 256
          minLength: 0
          type: string
          description: Replacement username for Basic authentication. Applicable only
            when the auth record was originally created with authType BASIC_AUTH.
            Can be updated independently — omitting this field leaves the existing
            username unchanged.
          example: new_api_user@example.com
        password:
          maxLength: 512
          minLength: 0
          type: string
          description: Replacement password for Basic authentication. Applicable only
            when the auth record was originally created with authType BASIC_AUTH.
            Can be updated independently — omitting this field leaves the existing
            password unchanged.
          example: newS3cretP@ssword
        apiKey:
          $ref: '#/components/schemas/ApiKeyRequest'
        headers:
          type: array
          description: "Replacement list of static headers attached to every outbound\
            \ request for this auth record. Pass a non-empty list to overwrite all\
            \ existing headers with the new set. Pass an empty list [] to remove all\
            \ headers. Omit this field entirely to leave existing headers unchanged."
          items:
            $ref: '#/components/schemas/HeaderEntry'
      description: Request body to partially update an existing authentication credential
        record. Only fields included in the request body are updated — omitted fields
        are left unchanged. The authType set at creation time is permanent and cannot
        be changed via this endpoint. Provide only the credential fields that match
        the original authType.
    IntegrationAuthResponse:
      type: object
      properties:
        authId:
          type: string
          description: Unique identifier for the auth record
          example: auth_P3kNz7Yv1Qm9
        integrationId:
          type: string
          description: Unique identifier of the parent integration
          example: intg_AuUKK371Spr5
        authType:
          type: string
          description: "The authentication strategy this credential set uses. Determines\
            \ which credential fields are required: API_KEY — provide the apiKey object\
            \ (key name, secret value, and position). BEARER_TOKEN — provide the token\
            \ field. BASIC_AUTH — provide username and password fields. NO_AUTH —\
            \ no credential fields required."
          example: API_KEY
          enum:
          - NO_AUTH
          - BASIC_AUTH
          - BEARER_TOKEN
          - API_KEY
        headers:
          type: object
          description: Optional list of static HTTP headers attached to every outbound
            request under this auth. Applied on top of any headers defined at the
            integration or tool level. Useful for fixed metadata headers required
            by the third-party API.
          example:
          - key: X-Request-Source
            value: sigmamind
        createdAt:
          type: string
          description: Timestamp when the record was created
          format: date-time
        updatedAt:
          type: string
          description: Timestamp when the record was last updated
          format: date-time
    ApiKeyRequest:
      required:
      - key
      - position
      - value
      type: object
      properties:
        key:
          maxLength: 128
          minLength: 0
          type: string
          description: Name of the header or query parameter that carries the API
            key. Must match what the target API expects.
          example: X-Shopify-Access-Token
        value:
          type: string
          description: The API key or secret value sent with each request.
          example: shpat_abc123xyz456
        position:
          type: string
          description: Where the API key should be added in the request. header →
            sent as an HTTP header (most common). query → appended to the request
            URL.
          example: header
          default: header
          enum:
          - header
          - query
      description: Defines how an API key is attached to outgoing requests. Use this
        when the API requires a key in headers or query parameters.
      example:
        key: X-API-KEY
        value: <secret>
        position: header
    HeaderEntry:
      required:
      - key
      - value
      type: object
      properties:
        key:
          maxLength: 256
          minLength: 0
          type: string
          description: HTTP header name exactly as expected by the target API.
          example: Content-Type
        value:
          maxLength: 1024
          minLength: 0
          type: string
          description: Static value for this header sent with every request. Must
            be a fixed string — use queryParams or bodyParams for dynamic values.
          example: application/json
      description: A single static HTTP header included in every request made by this
        tool. Tool-level headers are merged with integration-level and auth-level
        headers; tool-level values take precedence on key conflicts.
      example:
      - key: Content-Type
        value: application/json
    QueryParam:
      required:
      - key
      type: object
      properties:
        key:
          maxLength: 128
          minLength: 0
          type: string
          description: Query parameter name as expected by the target API.
          example: status
        value:
          maxLength: 1024
          minLength: 0
          type: string
          description: "Value for this query parameter. Use a {{variable}} placeholder\
            \ for values the agent supplies at runtime. Static string values are also\
            \ accepted for fixed parameters."
          example: "{{status}}"
      description: "A single query string parameter appended to the request URL at\
        \ invocation time. Use {{variable}} placeholders in values for parameters\
        \ the agent supplies dynamically. Path variables embedded in the endpoint\
        \ URL using {{variable}} syntax are separate and do not need to be declared\
        \ here."
      example:
      - key: status
        value: "{{status}}"
    PaginatedResponseIntegrationAuthResponse:
      type: object
      properties:
        data:
          type: array
          description: List of items for the current page. Contains up to 'size' number
            of records.
          items:
            $ref: '#/components/schemas/IntegrationAuthResponse'
        page:
          type: integer
          description: Current page number (0-based index). Indicates which page of
            results is being returned.
          format: int32
          example: 0
        size:
          type: integer
          description: Number of items requested per page. Determines the maximum
            size of the 'data' list.
          format: int32
          example: 20
        totalCount:
          type: integer
          description: Total number of records available across all pages. Useful
            for calculating pagination on the client side.
          format: int64
          example: 125
        totalPages:
          type: integer
          description: Total number of pages available based on totalCounts and size.
            Helps clients understand how many pages exist in total.
          format: int32
          example: 7
        hasNext:
          type: boolean
          description: Indicates whether there is a next page available after the
            current one. Useful for implementing 'Load More' or next navigation.
          example: true
        hasPrevious:
          type: boolean
          description: Indicates whether there is a previous page before the current
            one. Useful for enabling backward navigation.
          example: false
      description: Standard wrapper for paginated API responses. Use this when returning
        list data that is split across multiple pages. Includes the current page of
        results along with pagination metadata to help clients navigate through large
        datasets efficiently.

    # Integration Tools APIs Schemas
    CreateIntegrationToolRequest:
      required:
      - description
      - method
      - name
      - url
      type: object
      properties:
        name:
          maxLength: 128
          minLength: 0
          type: string
          description: "Action-oriented, snake_case name that uniquely identifies\
            \ this tool within the integration. AI agents use this name to select\
            \ the correct tool when deciding which operation to invoke. Must be unique\
            \ within the integration. Good examples: 'get_customer', 'create_order',\
            \ 'cancel_subscription'."
          example: get_customer
        description:
          maxLength: 1024
          minLength: 0
          type: string
          description: "Explanation of what this tool does and the exact conditions\
            \ under which an AI agent should invoke it. Agents rely on this description\
            \ to match a task to the correct tool — be specific about the action,\
            \ the resource it operates on, and any inputs the agent must supply."
          example: "Fetches a Shopify customer record by customer ID. Call this tool\
            \ when you need to look up customer details such as name, email, or order\
            \ history."
        method:
          type: string
          description: HTTP method used when invoking this tool's endpoint. GET retrieves
            a resource without side effects. POST creates a new resource. PUT fully
            replaces an existing resource. PATCH partially updates an existing resource.
            DELETE removes a resource.
          example: GET
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        url:
          maxLength: 1024
          minLength: 0
          type: string
          description: "Full URL of the API endpoint this tool calls. Supports {{variable}}\
            \ placeholders for path segments the agent resolves at runtime (e.g.,\
            \ {{customerId}} in the path). Path variables embedded here do not need\
            \ to be redeclared in queryParams."
          example: "https://my-store.myshopify.com/admin/api/2024-01/customers/{{customerId}}.json"
        headers:
          type: array
          description: "Static HTTP headers sent on every request made by this tool.\
            \ Merged with headers defined at the integration and auth levels; tool-level\
            \ headers take precedence on key conflicts. Values may contain {{variable}}\
            \ placeholders resolved by the agent at runtime. Leave empty if no tool-specific\
            \ headers are needed."
          example:
          - key: Content-Type
            value: application/json
          items:
            $ref: '#/components/schemas/HeaderEntry'
        queryParams:
          type: array
          description: "Query string parameters appended to the URL on every invocation\
            \ (e.g., ?status=active&limit=10). Values support {{variable}} placeholders\
            \ so the agent can supply them at runtime. Path variables already embedded\
            \ in the URL using {{variable}} syntax do not need to be listed here."
          example:
          - key: status
            value: "{{status}}"
          items:
            $ref: '#/components/schemas/QueryParam'
        bodyParams:
          type: object
          description: "Request body payload sent when this tool is invoked, as a\
            \ JSON object. Values support {{variable}} placeholders that the agent\
            \ resolves at runtime. Provide only for POST, PUT, and PATCH tools. Leave\
            \ empty or omit for GET and DELETE — body content is ignored for those\
            \ methods."
          example:
            first_name: "{{firstName}}"
            email: "{{email}}"
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: object
              - type: array
      description: "Request body to create a new API tool under an integration. A\
        \ tool represents a single callable API operation — for example 'get_customer'\
        \ or 'create_order' — that an AI agent can invoke at runtime. Dynamic values\
        \ are declared using {{variable}} placeholders in the URL, headers, query\
        \ params, or body; the agent resolves these at invocation time."
    UpdateIntegrationToolRequest:
      type: object
      properties:
        name:
          maxLength: 128
          minLength: 0
          type: string
          description: Replacement tool name. Must be snake_case and action-oriented.
            AI agents use this name to identify and select the correct tool when deciding
            which operation to invoke. Must remain unique within the integration.
            Omit to leave the existing name unchanged.
          example: get_customer_with_orders
        description:
          maxLength: 1024
          minLength: 0
          type: string
          description: "Replacement description of what this tool does and when an\
            \ agent should invoke it. Agents rely on this to match a task to the correct\
            \ tool — be specific about the action, the resource it operates on, and\
            \ required inputs. Omit to leave the existing description unchanged."
          example: Fetches a Shopify customer including their recent orders. Use when
            full customer context including purchase history is needed.
        accessType:
          type: string
          description: Visibility scope of this tool. 'local' means the tool is private
            to your account and only accessible within your integrations. 'community'
            means the tool is shared and discoverable by other accounts. Omit to leave
            the existing scope unchanged. Corresponds to the 'scope' field returned
            in IntegrationToolResponse.
          example: local
          enum:
          - local
          - community
        method:
          type: string
          description: Replacement HTTP method for the underlying API call. GET retrieves
            a resource without side effects. POST creates a new resource. PUT fully
            replaces an existing resource. PATCH partially updates an existing resource.
            DELETE removes a resource. Omit to leave the existing method unchanged.
          example: GET
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        endpoint:
          maxLength: 1024
          minLength: 0
          type: string
          description: "Replacement full URL of the API endpoint this tool calls.\
            \ Supports {{variable}} placeholders for path segments the agent resolves\
            \ at runtime. Updating this field automatically re-extracts all {{variable}}\
            \ placeholders and refreshes the tool's variable list. Omit to leave the\
            \ existing endpoint unchanged."
          example: "https://my-store.myshopify.com/admin/api/2024-01/customers/{{customerId}}/orders.json"
        headers:
          type: array
          description: "Replacement list of static HTTP headers sent on every request\
            \ by this tool. Tool-level headers are merged with integration and auth-level\
            \ headers; tool-level values take precedence on key conflicts. Pass a\
            \ non-empty list to overwrite all existing headers. Pass an empty list\
            \ [] to remove all tool-level headers. Omit this field entirely to leave\
            \ existing headers unchanged."
          example:
          - key: Content-Type
            value: application/json
          items:
            $ref: '#/components/schemas/HeaderEntry'
        queryParams:
          type: array
          description: "Replacement list of query string parameters appended to the\
            \ URL on every invocation. Values support {{variable}} placeholders the\
            \ agent resolves at runtime. Path variables embedded in the endpoint URL\
            \ using {{variable}} syntax do not need to be listed here. Pass a non-empty\
            \ list to overwrite all existing query params. Pass an empty list [] to\
            \ remove all query params. Omit this field entirely to leave existing\
            \ query params unchanged. Updating this field triggers automatic re-extraction\
            \ of {{variable}} placeholders."
          example:
          - key: status
            value: "{{status}}"
          items:
            $ref: '#/components/schemas/QueryParam'
        bodyParams:
          type: object
          description: "Replacement request body payload, as a JSON object. Values\
            \ support {{variable}} placeholders the agent resolves at runtime. Pass\
            \ a non-null map to overwrite the entire existing body. To remove the\
            \ body entirely, pass an empty map {}. Omit this field (leave it null)\
            \ to leave the existing body unchanged. Applicable only for POST, PUT,\
            \ and PATCH tools — ignored for GET and DELETE. Updating this field triggers\
            \ automatic re-extraction of {{variable}} placeholders."
          example:
            first_name: "{{firstName}}"
            email: "{{email}}"
      description: "Request body to partially update an existing integration tool.\
        \ Only fields included in the request are updated — omitted fields remain\
        \ unchanged. Updating endpoint, queryParams, or bodyParams automatically re-extracts\
        \ all {{variable}} placeholders and refreshes the tool's variable list."
    IntegrationToolResponse:
      type: object
      properties:
        toolId:
          type: string
          description: "Unique identifier for this tool. Use this value as toolId\
            \ when executing, updating, or deleting this tool."
          example: tool_X9pLm2Wq8Rt3
        integrationId:
          type: string
          description: Unique identifier of the integration this tool belongs to.
            Use this value as integrationId when making requests scoped to the parent
            integration.
          example: intg_AuUKK371Spr5
        name:
          type: string
          description: "Action-oriented name for this tool that identifies the operation\
            \ it performs. AI agents use this name to match a task to the correct\
            \ tool. Follows snake_case convention (e.g., 'get_customer', 'create_order')."
          example: get_order_details
        description:
          type: string
          description: "Explanation of what this tool does and when an AI agent should\
            \ invoke it. Agents rely on this description to decide whether this tool\
            \ matches the current task. A good description names the action, the resource\
            \ it operates on, and required inputs."
          example: "Fetches order details from Shopify by order ID. Call this tool\
            \ when you need to retrieve order status, line items, or shipping info."
        method:
          type: string
          description: HTTP method used when invoking this tool's endpoint. GET retrieves
            a resource without side effects. POST creates a new resource. PUT fully
            replaces an existing resource. PATCH partially updates an existing resource.
            DELETE removes a resource.
          example: GET
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        url:
          type: string
          description: "Full URL of the API endpoint this tool calls, including any\
            \ {{variable}} placeholders that the agent resolves at runtime using the\
            \ declared parameters. Path segments wrapped in {{}} (e.g., {{orderId}})\
            \ are substituted before the request is sent."
          example: "https://my-store.myshopify.com/admin/api/2024-01/orders/{{orderId}}.json"
        scope:
          type: string
          description: Visibility scope of this tool. 'local' means the tool is private
            to your account and only accessible within your integrations. 'community'
            means the tool is shared and discoverable by other users.
          example: local
          enum:
          - local
          - community
        headers:
          $ref: '#/components/schemas/JsonNode'
        queryParams:
          $ref: '#/components/schemas/JsonNode'
        bodyParams:
          $ref: '#/components/schemas/JsonNode'
        createdAt:
          type: string
          description: "UTC timestamp when this tool was created, in ISO 8601 format.\
            \ Use for auditing or determining how long the tool has been active."
          format: date-time
          example: 2024-04-20T10:00:00Z
        updatedAt:
          type: string
          description: "UTC timestamp when this tool was last modified, in ISO 8601\
            \ format. Use to detect configuration changes or invalidate cached tool\
            \ definitions."
          format: date-time
          example: 2024-04-21T08:30:00Z
      description: "Represents a single callable API tool registered under an integration.\
        \ Each tool maps to one specific API operation (e.g., 'Get Order', 'Create\
        \ Customer') and carries its full invocation config: HTTP method, endpoint\
        \ URL, headers, and parameters. AI agents use this response to understand\
        \ what the tool does and how to invoke it."
    ExecuteToolRequest:
      type: object
      properties:
        placeholders:
          type: object
          description: "A map of placeholder names to values used to resolve {{placeholder}}\
            \ tokens in the tool's endpoint URL, query parameters, and request body\
            \ at runtime. Each placeholder used in the request must have a corresponding\
            \ entry in this map. Example: for endpoint '/customers/{{customerId}}.json',\
            \ provide {\"customerId\": \"7654321\"}."
          example:
            customerId: "7654321"
        authId:
          maxLength: 64
          minLength: 0
          type: string
          description: 'The authId of the credential set to use for this execution. '
          example: auth_P3kNz7Yv1Qm9
      description: "Request body to execute a tool against its configured third-party\
        \ API. Supply values for every {{variable}} placeholder declared in the tool's\
        \ endpoint, queryParams, and bodyParams. The tool's stored auth credentials\
        \ are resolved automatically — you do not need to pass credentials here."
    ExecuteToolResponse:
      type: object
      properties:
        toolId:
          type: string
          description: Unique identifier of the tool that was executed.
          example: tool_X9pLm2Wq8Rt3
        integrationId:
