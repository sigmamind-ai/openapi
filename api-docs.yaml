    # Test Case APIs Schemas
    CreateTestCaseRequest:
      required:
      - agentId
      - successCriteria
      - userPrompt
      type: object
      properties:
        label:
          type: string
          description: "A human-readable name or label for the test case, used to\
            \ identify it in reports and dashboards."
          example: Angry Customer - Cancellation Flow
        agentId:
          type: string
          description: The unique identifier of the Agent that will respond during
            the chat simulation.
          example: D5D0p7TUs66TTAEAx
        llmModel:
          type: string
          description: "The LLM model used to generate Agent responses during the\
            \ simulation. To use OpenAI priority tier models, append '-fast-tier'\
            \ to the model name (e.g., 'gpt-4o-mini-fast-tier')."
          example: gpt-4o-mini
          enum:
          - gpt-5.2
          - gpt-5.2-fast-tier
          - gpt-5.1
          - gpt-5.1-fast-tier
          - gpt-5
          - gpt-5-fast-tier
          - gpt-5-mini
          - gpt-5-mini-fast-tier
          - gpt-5-nano
          - gpt-4.1
          - gpt-4.1-fast-tier
          - gpt-4.1-mini
          - gpt-4.1-mini-fast-tier
          - gpt-4.1-nano
          - gpt-4.1-nano-fast-tier
          - gpt-4o
          - gpt-4o-fast-tier
          - gpt-4o-mini
          - gpt-4o-mini-fast-tier
          - claude-haiku-4-5-20251001
          - claude-sonnet-4-5-20250929
          - claude-sonnet-4-20250514
          - gemini-3.1-flash-lite-preview
