    # Webhooks APIs Schemas
    CreateWebhookRequest:
      required:
      - agentId
      - events
      - name
      - url
      type: object
      properties:
        name:
          maxLength: 128
          minLength: 1
          type: string
          description: "Human-readable name for this webhook. Used to identify it\
            \ in listings and dashboards. Does not need to be unique, but a descriptive\
            \ name helps distinguish multiple webhooks on the same agent."
          example: Call Events - Production
        agentId:
          maxLength: 64
          minLength: 1
          type: string
          description: Unique identifier of the agent this webhook is scoped to. Only
            events originating from this agent will be delivered to this webhook's
            URL. Use the agentId returned when the agent was created.
          example: D5D0p7TUs66TTAEAx
        url:
          pattern: https?://.+
          type: string
          description: HTTPS endpoint that will receive event payloads as HTTP POST
            requests. Must be publicly reachable. The system expects an HTTP 2xx response
            within the configured timeout to confirm delivery. Non-2xx responses or
            timeouts are treated as delivery failures.
          example: https://yourapp.com/webhooks/sigmamind
        events:
          uniqueItems: true
          type: array
          description: Set of event types that will trigger a delivery to this webhook.
            'conversation_started' fires when an agent session begins. 'conversation_ended'
            fires when a session closes. 'conversation_analysed' fires when post-call
            analysis is complete. At least one event must be specified. Only events
            in this set will be sent — all others are silently ignored.
          example:
          - conversation_started
          - conversation_ended
          items:
            type: string
            description: Set of event types that will trigger a delivery to this webhook.
              'conversation_started' fires when an agent session begins. 'conversation_ended'
              fires when a session closes. 'conversation_analysed' fires when post-call
              analysis is complete. At least one event must be specified. Only events
              in this set will be sent — all others are silently ignored.
            example: "[\"conversation_started\",\"conversation_ended\"]"
            enum:
            - conversation_started
            - conversation_ended
            - conversation_analysed
      description: Request body to register a new webhook. A webhook delivers real-time
        event notifications to your server via HTTP POST whenever selected events
        occur on an agent. The receiving endpoint must be publicly reachable over
        HTTPS and return HTTP 2xx to acknowledge delivery.
    WebhookResponse:
      type: object
      properties:
        workspaceId:
          type: string
          description: Unique identifier of the workspace this webhook belongs to.
            Use this value to scope queries or filter webhooks by workspace.
          example: org_BUbkx3PsbzQm5V10
        webhookId:
          type: string
          description: "Unique identifier for this webhook. Use this value as webhookId\
            \ when updating, deleting, or retrieving this webhook via the API."
          example: wh_BUbkx3PsbzQm5V10
        name:
          type: string
          description: Display name of this webhook as set at creation time. Used
            to identify it in listings and dashboards.
          example: Call Events - Production
        agentId:
          type: string
          description: Unique identifier of the agent this webhook is scoped to. Only
            events originating from this agent are delivered to this webhook's URL.
          example: D5D0p7TUs66TTAEAx
        active:
          type: boolean
          description: "Whether this webhook is currently active and will receive\
            \ event deliveries. When false, the webhook is registered but no events\
            \ are sent to the URL. Toggle this to pause or resume delivery without\
            \ deleting the webhook."
          example: true
        secret:
          type: string
          description: HMAC secret key used to sign outgoing webhook payloads. The
            system includes a signature header on each delivery computed using this
            secret. Verify the signature on your server to confirm payloads are genuinely
            from SigmaMind. Store this value securely — it is only returned at creation
            time.
          example: mK9vXq2pL8nR5tY1wA3sD6fH0jC4bE7u
        events:
          type: array
          description: Event types this webhook is subscribed to. Only events in this
            list trigger a delivery to the webhook URL. 'conversation_started' fires
            when an agent session begins. 'conversation_ended' fires when a session
            closes. 'conversation_analysed' fires when post-call analysis is complete.
          items:
            type: string
            description: Event types this webhook is subscribed to. Only events in
              this list trigger a delivery to the webhook URL. 'conversation_started'
              fires when an agent session begins. 'conversation_ended' fires when
              a session closes. 'conversation_analysed' fires when post-call analysis
              is complete.
            enum:
            - conversation_started
            - conversation_ended
            - conversation_analysed
          enum:
          - conversation_started
          - conversation_ended
          - conversation_analysed
        url:
          type: string
      description: "Full details of a registered webhook. Includes delivery target,\
        \ the agent it is scoped to, active status, subscribed events, and the secret\
        \ used to verify payload authenticity."
    PaginatedResponseWebhookResponse:
      type: object
      properties:
        data:
          type: array
          description: List of items for the current page. Contains up to 'size' number
            of records.
          items:
            $ref: '#/components/schemas/WebhookResponse'
        page:
          type: integer
          description: Current page number (0-based index). Indicates which page of
            results is being returned.
          format: int32
          example: 0
        size:
          type: integer
          description: Number of items requested per page. Determines the maximum
            size of the 'data' list.
          format: int32
          example: 20
        totalCount:
          type: integer
          description: Total number of records available across all pages. Useful
