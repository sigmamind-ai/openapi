          description: "ISO 3166-1 alpha-2 country code that determines which country\
            \ the number is purchased from. Required when phoneNumber is not provided\
            \ — the system selects an available number in this country. Ignored when\
            \ phoneNumber is explicitly specified. Must be exactly two uppercase letters\
            \ (e.g., 'US', 'IN', 'GB')."
          example: US
        areaCode:
          maximum: 99999
          minimum: 100
          type: integer
          description: "Preferred area or region code used to narrow down number selection\
            \ within the specified country. Optional — only considered when countryCode\
            \ is provided and phoneNumber is omitted. If no number is available in\
            \ this area code, the system selects the nearest available match."
          format: int32
          example: 415
        phoneNumber:
          pattern: "^\\+[1-9][0-9]{6,14}$"
          type: string
          description: "Specific phone number to purchase, in +E.164 format (e.g.,\
            \ +14155552671). When provided, the system attempts to purchase exactly\
            \ this number. Either this field or countryCode must be supplied — both\
            \ cannot be omitted. If omitted, the system auto-selects an available\
            \ number based on countryCode and areaCode."
          example: "+14155552671"
        inboundAgentId:
          maxLength: 64
          minLength: 0
          type: string
          description: "Unique identifier of the agent that will handle inbound calls\
            \ received on this number. When a call arrives at this number, it is routed\
            \ to this agent automatically. If omitted, inbound calls will not be handled\
            \ by an agent until one is assigned."
          example: awTw7UKhOsLGiDbt
        outboundAgentId:
          maxLength: 64
          minLength: 0
          type: string
          description: "Unique identifier of the agent that will handle outbound calls\
            \ made from this number. When this number is used as the caller ID in\
            \ an outbound call, this agent manages the conversation. If omitted, the\
            \ agent must be specified explicitly at call creation time."
          example: awTw7UKhOsLGiDbt
        outboundPhoneNumber:
          pattern: "^\\+[1-9][0-9]{6,14}$"
          type: string
          description: "Default destination number dialled during test calls initiated\
            \ from this phone number, in +E.164 format. Used to verify the number\
            \ is working correctly without targeting a real contact. Must be a valid\
            \ number capable of receiving calls. If omitted, test calls cannot be\
            \ placed until this is configured."
          example: "+14155552671"
      description: "Request body to purchase and provision a new phone number through\
        \ SigmaMind. Either phoneNumber or countryCode must be provided. Supply phoneNumber\
        \ to purchase a specific number, or supply countryCode (with optional areaCode)\
        \ to let the system auto-select an available number in that region."
    ImportPhoneNumberRequest_Byo:
      type: object
      properties:
        friendlyName:
          maxLength: 128
          minLength: 0
          type: string
          description: "Human-readable label for this phone number. Used to identify\
            \ it in listings and dashboards. If omitted, the number itself is used\
            \ as the display name."
          example: BYO - Main Office Line
        phoneNumber:
          pattern: "^\\+[1-9][0-9]{6,14}$"
          type: string
          description: "The phone number being imported, in +E.164 format (e.g., +14155552671).\
            \ Must be a number you own and have configured on your external SIP trunk.\
            \ This number will be registered in SigmaMind and used as the caller ID\
            \ for outbound calls and the destination for inbound calls routed through\
            \ your trunk."
          example: "+14155552671"
        inboundAgentId:
          maxLength: 64
          minLength: 0
          type: string
          description: "Unique identifier of the agent that will handle inbound calls\
            \ received on this number. When a call arrives at this number via the\
            \ SIP trunk, it is routed to this agent automatically. If omitted, inbound\
            \ calls will not be handled by an agent until one is assigned."
          example: awTw7UKhOsLGiDbt
        outboundAgentId:
          maxLength: 64
          minLength: 0
          type: string
          description: "Unique identifier of the agent that will handle outbound calls\
            \ made from this number. When this number is used as the caller ID in\
            \ an outbound call, this agent manages the conversation. If omitted, the\
            \ agent must be specified explicitly at call creation time."
          example: awTw7UKhOsLGiDbt
        trunkUsername:
          maxLength: 128
          minLength: 0
          type: string
          description: Username credential for authenticating outbound calls on your
            SIP trunk. Must match the trunk username configured in your telecom provider's
            account. Required for outbound call routing through the trunk.
          example: my_trunk_user
        trunkPassword:
          maxLength: 128
          minLength: 0
          type: string
          description: Password credential for authenticating outbound calls on your
            SIP trunk. Must match the trunk password configured in your telecom provider's
            account. Required for outbound call routing through the trunk. Stored
            securely and never returned in API responses.
          example: tr!nkP@ssword
        terminationSipURI:
          maxLength: 253
          minLength: 0
          type: string
          description: "SIP URI of the termination endpoint provided by your telecom\
            \ provider. SigmaMind sends outbound calls to this address to route them\
            \ through your trunk. Obtain this value from your provider's SIP trunking\
            \ configuration (e.g., 'sip.telnyx.com', 'sip.twilio.com'). Required for\
            \ outbound call delivery."
          example: sip.telnyx.com
        outboundPhoneNumber:
          pattern: "^\\+[1-9][0-9]{6,14}$"
          type: string
          description: "Default destination number dialled during test calls initiated\
            \ from this phone number, in +E.164 format. Used to verify the SIP trunk\
            \ is connected and routing calls correctly. Must be a valid number capable\
            \ of receiving calls. If omitted, test calls cannot be placed until this\
            \ is configured."
          example: "+14155552671"
      description: Request body to import an existing phone number you own into SigmaMind
        via SIP trunking (BYO — Bring Your Own number). Use this when the number is
        already provisioned with an external telecom provider and you want SigmaMind
        to route calls through it using your own SIP trunk credentials. The number
        is not purchased — it remains with your provider.
    PhoneNumberResponse:
      type: object
      properties:
        sipPhoneNumber:
          type: string
          description: The caller’s phone number in +E.164 format. This number must
            be obtained from SigmaMind or configured using SIP trunking with SigmaMind.
          example: "+14155552671"
        provider:
          type: string
          description: The service provider associated with the phone number.
          example: twilio
          enum:
          - twilio
          - telnyx
          - byo
        inboundAgentId:
          type: string
          description: Default agent ID assigned to handle inbound calls for this
            phone number.
          example: agent_D5D0p7TUs66TTAEAx
        outboundAgentId:
          type: string
          description: Default agent ID assigned to handle outbound calls for this
            phone number.
          example: agent_D5D0p7TUs66TTAEAx
        outboundPhoneNumber:
          type: string
          description: "The default outbound phone number of the callee, represented\
            \ in +E.164 format"
          example: "+14155552671"
        active:
          type: boolean
          description: Indicates whether the phone number is currently active and
            available for use.
          example: true
        terminationSipURI:
          type: string
          description: "The SIP URI of the phone number, provided by the service provider\
            \ for call termination."
          example: sip.telnyx.com
        friendlyName:
          type: string
          description: A user-friendly display name assigned to this phone number.
          example: Support Line - US
      description: Caller phone number used to dial contacts in this campaign. This
        number appears as the caller ID on recipients' devices.
    PhoneNumberResponse_Telephony:
      type: object
      properties:
        sipPhoneNumber:
          type: string
          description: The caller’s phone number in +E.164 format. This number must
            be obtained from SigmaMind or configured using SIP trunking with SigmaMind.
          example: "+14155552671"
        provider:
          type: string
          description: The service provider associated with the phone number.
          example: twilio
          enum:
          - twilio
          - telnyx
          - byo
        inboundAgentId:
          type: string
          description: Default agent ID assigned to handle inbound calls for this
            phone number.
          example: agent_D5D0p7TUs66TTAEAx
        outboundAgentId:
          type: string
          description: Default agent ID assigned to handle outbound calls for this
            phone number.
          example: agent_D5D0p7TUs66TTAEAx
        outboundPhoneNumber:
          type: string
          description: "The default outbound phone number of the callee, represented\
