      description: This tool is used to navigate through IVR.
      properties:
        type:
          type: string
          example: ivr_navigator
          enum:
          - ivr_navigator
        description:
          type: string
          description: When to call this tool.
        ivrStartsConversation:
          type: boolean
          description: Indicates whether the call is initiated by an IVR (Interactive
            Voice Response) system. Set to true when the interaction begins with
            an automated IVR prompt before connecting to an agent or system flow.
