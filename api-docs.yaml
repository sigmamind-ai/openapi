components:
  schemas:
    # Calls APIs Schemas
    CreateCallRequest:
      required:
      - fromPhoneNumber
      - toPhoneNumber
      type: object
      properties:
        fromPhoneNumber:
          pattern: "^\\+[1-9][0-9]{6,14}$"
          type: string
          description: "Caller's phone number in +E.164 format (e.g., +14155552671).\
            \ Must be a number provisioned in SigmaMind or configured via SIP trunking\
            \ that is enabled for outbound calls. This number appears as the caller\
            \ ID on the recipient's device."
          example: "+14155552671"
        toPhoneNumber:
          pattern: "^\\+[1-9][0-9]{6,14}$"
          type: string
          description: "Destination phone number to dial, in +E.164 format (e.g.,\
            \ +14155552671). Must be a valid number capable of receiving calls. Include\
            \ the country code — local-format numbers without a leading '+' are rejected."
          example: "+14155552671"
        agentId:
          maxLength: 64
          minLength: 0
          type: string
          description: "Unique identifier of the agent that will handle this call.\
            \ The agent controls the conversation flow, prompts, and any tools invoked\
            \ during the call. If omitted, the default agent configured for the caller's\
            \ phone number is used."
          example: D5D0p7TUs66TTAEAx
        dynamicVariables:
          type: object
          description: "Key-value pairs used to personalise the agent's behaviour\
            \ for this specific call. Keys must match the variable names defined in\
            \ the agent's configuration (e.g., 'customer_name', 'account_id'). These\
            \ values are injected into the agent's prompts and tools at call start.\
            \ Leave empty if the agent requires no personalisation."
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: object
              - type: array
          example:
            customer_name: Michael
            account_id: ACC-001
      description: "Request body to initiate a single outbound call. Requires a SigmaMind-provisioned\
        \ caller number, a destination number, and the agent that will handle the\
        \ call. Dynamic variables allow the agent to personalise the conversation\
        \ at runtime."
    CallResponse:
      type: object
      properties:
        callId:
          type: string
          description: "Unique identifier for this call. Use this value as callId\
            \ when retrieving, updating, or referencing this call in subsequent API\
            \ calls."
          example: call_AuUKK371Spr5nHJS
        callType:
          type: string
          description: Direction and channel of the call. 'inbound' means the call
            was received by SigmaMind from an external caller. 'outbound' means SigmaMind
            dialled the destination number. 'web' means the call originated from a
            browser-based session.
          example: outbound
          enum:
          - inbound
          - outbound
          - web
          - chat
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumberResponse'
        campaign:
          $ref: '#/components/schemas/CampaignResponse'
        status:
          type: string
          description: Current lifecycle state of the call. 'scheduled' means the
            call is queued but dialling has not started. 'in_progress' means the call
            is currently active. 'ended' means the call completed normally. 'not_connected'
            means the call was attempted but the recipient did not answer or connect.
            'error' means the system encountered a failure while trying to place or
            manage the call.
          example: ended
          enum:
          - scheduled
          - in_progress
          - ended
          - not_connected
          - error
        transcript:
          type: string
          description: transcript of the conversation in chat
        startTime:
          type: string
          description: "UTC timestamp when the call was connected and the active session\
            \ began, in ISO 8601 format. Null if the call never reached in_progress\
            \ state."
          format: date-time
          example: 2024-04-20T10:00:00Z
        endTime:
          type: string
          description: "UTC timestamp when the call session ended, in ISO 8601 format.\
            \ Null if the call is still in progress or was never connected."
          format: date-time
          example: 2024-04-20T10:02:00Z
        duration:
          type: integer
          description: Total duration of the connected call session in seconds. Measured
            from startTime to endTime. Null if the call was never connected.
          format: int32
          example: 120
        terminationReason:
          type: string
          description: Reason the call session ended. 'customer_ended_call' — the
            recipient hung up. 'agent_ended_call' — the AI agent closed the session.
            'inactivity' — the call was terminated due to silence or no interaction.
            'voicemail' — the call reached voicemail and was not answered live. 'busy'
            — the destination number was busy. 'no_answer' — the call rang but was
            not picked up within the timeout. 'failed' — the call could not be placed
            due to a system or carrier error. Null if the call has not yet ended.
          example: customer_ended_call
          enum:
          - agent_ended_call
          - customer_ended_call
          - voicemail
          - inactivity
          - max_duration
          - busy
          - no_answer
          - failed
          - unknown
        createdAt:
          type: string
          description: "UTC timestamp when this call record was created in the system,\
            \ in ISO 8601 format. For outbound calls this is typically when the call\
            \ was scheduled or triggered."
          format: date-time
          example: 2024-04-20T09:59:50Z
        updatedAt:
          type: string
          description: "UTC timestamp when this call record was last updated, in ISO\
            \ 8601 format. Updates occur when the call status changes, the session\
            \ ends, or metadata is modified."
          format: date-time
          example: 2024-04-20T10:02:05Z
        dynamicVariables:
          $ref: '#/components/schemas/JsonNode'
        recordingUrl:
          type: string
          description: URL of the call recording audio file. Available after the call
            ends and recording processing is complete. Null if recording is not enabled
            for this call or if the call did not connect.
          example: https://livekitmedia.blob.core.windows.net/recording-container-prod/room-ST_abc123/recording.mp3
        agent:
          $ref: '#/components/schemas/AgentResponse'
      description: "Full details of a single call record. Includes call identity,\
        \ direction, status, timing, the agent that handled it, and the campaign it\
        \ belongs to if applicable."
    PaginatedResponseCallResponse:
      type: object
      properties:
        data:
          type: array
          description: List of items for the current page. Contains up to 'size' number
            of records.
          items:
            $ref: '#/components/schemas/CallResponse'
        page:
          type: integer
          description: Current page number (0-based index). Indicates which page of
            results is being returned.
          format: int32
          example: 0
        size:
          type: integer
          description: Number of items requested per page. Determines the maximum
            size of the 'data' list.
          format: int32
          example: 20
        totalCount:
          type: integer
          description: Total number of records available across all pages. Useful
            for calculating pagination on the client side.
          format: int64
          example: 125
        totalPages:
          type: integer
          description: Total number of pages available based on totalCounts and size.
            Helps clients understand how many pages exist in total.
          format: int32
          example: 7
        hasNext:
          type: boolean
          description: Indicates whether there is a next page available after the
            current one. Useful for implementing 'Load More' or next navigation.
          example: true
        hasPrevious:
          type: boolean
          description: Indicates whether there is a previous page before the current
            one. Useful for enabling backward navigation.
          example: false
      description: Standard wrapper for paginated API responses. Use this when returning
        list data that is split across multiple pages. Includes the current page of
        results along with pagination metadata to help clients navigate through large
        datasets efficiently.

    # Chat APIs Schemas
    CreateChatRequest:
