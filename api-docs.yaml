    # Campaign APIs Schemas
    CreateCampaignRequest:
      required:
      - agentId
      - campaignName
      - file
      - sipPhoneNumber
      type: object
      properties:
        campaignName:
          maxLength: 128
          minLength: 1
          type: string
          description: "Display name for this campaign. Used to identify the campaign\
            \ in listings, dashboards, and reports. Must be unique within your account."
          example: Q4 Outreach Campaign
        sipPhoneNumber:
          pattern: "^\\+[1-9][0-9]{6,14}$"
          type: string
          description: "Caller ID phone number used for all outbound calls in this\
            \ campaign, in +E.164 format. Must be a number provisioned in SigmaMind\
            \ or configured via SIP trunking that is enabled for outbound calls. This\
            \ number appears on the recipient's device as the incoming caller."
          example: "+14155552671"
        agentId:
          maxLength: 64
          minLength: 1
          type: string
          description: "Unique identifier of the agent that will handle every call\
            \ in this campaign. The agent controls the conversation flow, scripts,\
            \ and tools used during each call. All contacts in the uploaded CSV will\
            \ be called using this agent."
          example: D5D0p7TUs66TTAEAx
        file:
          type: string
          format: binary
        isScheduled:
          type: boolean
          description: "Whether this campaign should be held and launched at a future\
            \ date and time instead of starting immediately. When true, scheduledDate,\
            \ scheduledTime, and scheduledTimezone are all required. When false or\
            \ omitted, the campaign starts as soon as it is created."
          example: true
        scheduledDate:
          type: string
          description: "Date on which the campaign should launch, in YYYY-MM-DD format.\
            \ Required when isScheduled is true. Ignored when isScheduled is false\
            \ or omitted. Must be a future date."
          format: date
          example: 2025-09-25
        scheduledTime:
          type: string
          description: "Time at which the campaign should launch on the scheduled\
            \ date, in HH:mm:ss format. Required when isScheduled is true. Ignored\
            \ when isScheduled is false or omitted. Interpreted in the timezone specified\
            \ by scheduledTimezone."
          format: time
          example: 12:00:00
        scheduledTimezone:
          type: string
          description: "IANA timezone name used to interpret scheduledDate and scheduledTime.\
            \ Required when isScheduled is true. Ignored when isScheduled is false\
            \ or omitted. Use a valid IANA timezone identifier (e.g., 'America/Los_Angeles',\
            \ 'Europe/London', 'Asia/Kolkata')."
          example: America/Los_Angeles
        concurrentCalls:
          type: integer
          description: "Maximum number of calls the campaign is allowed to have active\
            \ simultaneously. Controls the dialling throughput — a higher value dials\
            \ more contacts in parallel. If omitted, the account default is used.\
            \ Must be a positive integer."
          format: int32
          example: 5
        dynamicVariables:
          type: object
          description: Default dynamic variable values applied to every call in the
            campaign when the CSV does not supply a value for a given variable. Keys
            must match variable names defined in the agent's configuration. Per-contact
            values in the CSV take precedence over these defaults. Leave empty if
            the CSV provides all required variables.
          example:
            customer_name: Michael
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: object
              - type: array
      description: Request body to create a new outbound call campaign. A campaign
        dials a list of phone numbers using a selected agent and caller number. The
        contact list and any per-contact dynamic variables are uploaded as a CSV file.
        Campaigns can start immediately or be scheduled for a future date and time.
    CampaignResponse:
      type: object
      properties:
        campaignId:
          type: string
          description: "Unique identifier for this campaign. Use this value as campaignId\
            \ when updating, deleting, or triggering this campaign via the API."
          example: camp_XiQEBcj9cc5TFRB4
        campaignName:
          type: string
          description: Display name of this campaign as set at creation time. Used
            to identify the campaign in listings and dashboards.
          example: Q4 Outreach Campaign
        campaignStatus:
          type: string
          description: Current lifecycle state of the campaign. 'live' means the campaign
            is actively dialling contacts. 'scheduled' means the campaign is configured
            to launch at a future date and time. 'paused' means dialling has been
            suspended and can be resumed. 'completed' means all contacts have been
            dialled and the campaign has finished.
          example: live
          enum:
          - live
          - scheduled
          - paused
          - completed
        scheduledDate:
          type: string
          description: "The date and time when this campaign is scheduled to launch,\
            \ including timezone. Present only when isScheduled is true. Null for\
            \ campaigns that started immediately at creation."
          format: date-time
          example: 2025-09-25T12:00:00-07:00
        concurrentCalls:
          type: integer
          description: Maximum number of calls allowed to be active simultaneously
            in this campaign. Determines dialling throughput — higher values dial
            more contacts in parallel. Reflects the value set at creation or last
            updated via the update endpoint.
          format: int32
          example: 5
        agent:
          $ref: '#/components/schemas/AgentResponse'
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumberResponse'
        errors:
          type: array
          description: List of validation errors encountered when processing the campaign's
            contact CSV file. Present only when the upload contained rows with invalid
            phone numbers or missing required variables. Null or empty when the file
            was processed without errors.
          example:
          - "Row 3: missing required variable 'customer_name'"
          - "Row 7: invalid phone number '+1234'"
          items:
            type: string
            description: List of validation errors encountered when processing the
              campaign's contact CSV file. Present only when the upload contained
              rows with invalid phone numbers or missing required variables. Null
              or empty when the file was processed without errors.
            example: "[\"Row 3: missing required variable 'customer_name'\",\"Row\
              \ 7: invalid phone number '+1234'\"]"
        scheduled:
          type: boolean
      description: "Full details of a campaign record. Includes the campaign's identity,\
        \ current status, schedule configuration, the agent handling calls, and the\
        \ caller phone number used to dial contacts."
