      properties:
        variableName:
          type: string
          description: Name of the variable
          example: customer_name
        dataType:
          pattern: ^(text|boolean|number|dateTimeIso8601)$
          type: string
          description: Data type of the variable to be extracted.
          example: dateTimeIso8601
          enum:
          - text
          - boolean
          - number
          - dateTimeIso8601
        description:
          type: string
          description: Description of what this variable represents
      description: "Defines a variable to be extracted from a conversation, including\
        \ its name, data type, and description. "
    VoiceEndCallTool:
      required:
      - type
      type: object
      description: Ends the current voice call
